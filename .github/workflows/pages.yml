name: Publish the game to GitHub Pages
on:
  workflow_dispatch:
  schedule:
    - cron: '32 4 * * 1'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh restaurant locations
        if: github.event_name == 'schedule'
        run: python3 scripts/update-venues.py
      - name: Verify game rules, rooms and catalog
        run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified game
        id: deployment
        uses: actions/deploy-pages@v4
